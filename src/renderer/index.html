<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' mediastream: blob:"
    />
    <title>Meeting Notes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="drag-area"></div>

      <button id="record-button" class="record-cta">
        <span class="dot"></span><span id="record-label">Gravar reunião</span>
      </button>

      <button id="nav-tasks" class="nav-item">
        <span>✅ Minhas tarefas</span><span id="tasks-count" class="count"></span>
      </button>

      <input id="search" type="search" placeholder="Buscar reuniões  ⌘F" />

      <nav id="meeting-list" class="meeting-list"></nav>

      <footer class="sidebar-footer">
        <button id="settings-button" class="link">⚙︎ Configurações</button>
        <button id="folder-button" class="link">📁 Pasta</button>
      </footer>
    </aside>

    <main>
      <div class="drag-area"></div>
      <div id="banner" class="banner" hidden></div>

      <section id="view-empty" class="view center">
        <h1>Nenhuma reunião ainda</h1>
        <p class="muted">Clique em <b>Gravar reunião</b>, use <kbd class="shortcut-hint"></kbd> ou rode <code>meeting</code> no terminal.</p>
      </section>

      <section id="view-recording" class="view center" hidden>
        <div class="pulse"></div>
        <div id="timer" class="timer">00:00:00</div>
        <div class="meter"><div id="meter-fill"></div></div>
        <p id="sources" class="muted"></p>
        <p id="progress-live" class="muted small"></p>
        <button id="stop-button" class="primary">Parar e resumir</button>
      </section>

      <section id="view-processing" class="view center" hidden>
        <div class="spinner"></div>
        <h1 id="processing-step">Processando…</h1>
        <p id="progress" class="muted"></p>
      </section>

      <section id="view-meeting" class="view" hidden>
        <header class="detail-header">
          <div>
            <h1 id="meeting-title"></h1>
            <p id="meeting-meta" class="muted small"></p>
          </div>
          <div class="actions">
            <button id="copy-button">Copiar resumo</button>
            <button id="meeting-folder-button">Abrir pasta</button>
          </div>
        </header>
        <div class="tabs">
          <button data-tab="summary" class="tab active">Resumo</button>
          <button data-tab="transcript" class="tab">Transcrição</button>
        </div>
        <article id="meeting-summary"></article>
        <article id="meeting-transcript" hidden></article>
      </section>

      <section id="view-tasks" class="view" hidden>
        <header class="detail-header">
          <h1>Tarefas pendentes</h1>
          <label class="check"><input id="only-mine" type="checkbox" /> Só as minhas</label>
        </header>
        <form id="tasks-add-form" class="add-task">
          <input id="tasks-add-input" type="text" placeholder="Adicionar tarefa…" autocomplete="off" maxlength="500" />
          <button type="submit">Adicionar</button>
        </form>
        <div id="tasks-list"></div>
      </section>

      <section id="view-error" class="view center" hidden>
        <h1>Algo deu errado</h1>
        <p id="error-message" class="muted"></p>
        <div class="actions">
          <button id="error-back-button">Voltar</button>
        </div>
      </section>

      <section id="view-settings" class="view narrow" hidden>
        <h1>Configurações</h1>
        <p id="settings-reason" class="banner" hidden></p>
        <form id="settings-form">
          <label>Chave da API da OpenAI
            <input name="apiKey" type="password" placeholder="sk-…" autocomplete="off" />
            <small id="api-key-status" class="muted"></small>
          </label>
          <label>Seu nome (para identificar as suas tarefas)
            <input name="userName" type="text" placeholder="João" />
          </label>
          <label>Microfone
            <select name="micDeviceId"></select>
          </label>
          <label class="check">
            <input name="captureSystemAudio" type="checkbox" />
            Gravar também o áudio do sistema (as outras pessoas da call)
          </label>
          <fieldset class="engine">
            <legend>Transcrição</legend>
            <label class="check">
              <input type="radio" name="transcriptionEngine" value="local" />
              <span><b>No Mac (whisper.cpp)</b> — grátis e offline; separa você dos outros</span>
            </label>
            <label class="check">
              <input type="radio" name="transcriptionEngine" value="openai" />
              <span><b>OpenAI</b> — pago; separa também os participantes entre si</span>
            </label>
            <div id="local-status" class="local-status"></div>
            <label id="openai-model-field">Modelo de transcrição da OpenAI
              <input name="transcriptionModel" type="text" />
            </label>
          </fieldset>
          <label>Modelo do resumo (OpenAI)
            <input name="summaryModel" type="text" />
          </label>
          <div class="row">
            <label>Idioma (ISO-639-1)
              <input name="language" type="text" maxlength="5" />
            </label>
            <label>Atalho global
              <input name="shortcut" type="text" />
            </label>
          </div>
          <label>Pasta das notas
            <input name="notesDir" type="text" />
          </label>
          <label class="check">
            <input name="keepAudio" type="checkbox" />
            Manter os arquivos de áudio depois de transcrever
          </label>
          <div class="actions">
            <button type="button" id="settings-cancel">Cancelar</button>
            <button type="submit" class="primary">Salvar</button>
          </div>
        </form>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>

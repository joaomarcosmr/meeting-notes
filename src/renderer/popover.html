<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>Tarefas</title>
    <link rel="stylesheet" href="popover.css" />
  </head>
  <body>
    <header>
      <h1>Tarefas <span id="count" class="count"></span></h1>
      <button id="menu-button" class="icon" title="Opções">⚙︎</button>
    </header>

    <button id="record" class="record"><span class="dot"></span><span id="record-label">Gravar reunião</span></button>

    <form id="add-form">
      <input id="add-input" type="text" placeholder="Adicionar tarefa…" autocomplete="off" maxlength="500" />
    </form>

    <div class="filter">
      <button data-filter="all" class="active">Todas</button>
      <button data-filter="mine">Só as minhas</button>
    </div>

    <ul id="list"></ul>

    <footer>
      <button id="open-main" class="link">Abrir histórico</button>
      <button id="open-tasks" class="link">Ver na janela ›</button>
    </footer>

    <script type="module" src="popover.js"></script>
  </body>
</html>
